name: Daily log

on:
  schedule:
    - cron: '23 * * * *'   # every hour; scripts/plan.py decides if this hour commits
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-log

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit the number planned for this hour
        run: |
          N=$(python3 scripts/plan.py)
          echo "Commits planned for this hour: $N"
          [ "$N" -eq 0 ] && exit 0
          git config user.name  "Arthurized"
          git config user.email "219266778+Arthurized@users.noreply.github.com"
          for i in $(seq 1 "$N"); do
            date -u '+%Y-%m-%d %H:%M:%S' > log.txt
            git add log.txt
            git commit -m "update log"
            sleep $((RANDOM % 20))
          done
          git push
