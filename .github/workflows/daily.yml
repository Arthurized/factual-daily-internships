name: Daily log

on:
  schedule:
    - cron: '23 * * * *'   # every hour; scripts/plan.py decides if this hour commits
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-log

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the number of internships planned for this hour
        env:
          PYTHONIOENCODING: utf-8
        run: |
          N=$(python3 scripts/plan.py)
          echo "Commits planned for this hour: $N"
          [ "$N" -eq 0 ] && exit 0
          git config user.name  "Arthurized"
          git config user.email "219266778+Arthurized@users.noreply.github.com"
          for i in $(seq 1 "$N"); do
            if ! MSG=$(python3 scripts/internships.py); then
              echo "No new internships right now, stopping"
              break
            fi
            git add internships.md
            git commit -m "$MSG"
            sleep $((RANDOM % 20))
          done
          git push
