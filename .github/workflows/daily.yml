name: Daily log

on:
  schedule:
    - cron: '23 * * * *'   # every hour; scripts/plan.py decides if this hour commits
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-log

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # plan.py counts today's commits from history

      - name: Add an internship and a fact per planned commit, at random times
        env:
          PYTHONIOENCODING: utf-8
          FILTER_WORDS: ${{ secrets.FILTER_WORDS }}
          SOURCE_CACHE: ${{ runner.temp }}   # download each source once per run
        run: |
          N=$(python3 scripts/plan.py)
          echo "Commits due now: $N"
          [ "$N" -eq 0 ] && exit 0
          [ "$N" -gt 20 ] && N=20
          git config user.name  "Arthurized"
          git config user.email "219266778+Arthurized@users.noreply.github.com"

          sync() {   # pull, undoing a failed rebase so the loop can continue
            git pull -q --rebase || { git rebase --abort 2>/dev/null; return 1; }
          }
          push() {   # push; if rejected, pull and retry
            for attempt in 1 2 3; do
              git push -q && return 0
              sync || true
              sleep 5
            done
            echo "Push failed; commits stay local and will be retried"
            return 1
          }

          # N random moments within the next 55 minutes, before midnight UTC
          OFFSETS=$(python3 scripts/offsets.py "$N")
          echo "Commit offsets (s): $OFFSETS"
          START=$(date +%s); DAY=$(date -u +%F)
          for OFF in $OFFSETS; do
            WAIT=$((START + OFF - $(date +%s)))   # wait until the planned moment
            [ "$WAIT" -gt 0 ] && sleep "$WAIT"
            if [ "$(date -u +%F)" != "$DAY" ]; then
              echo "Day changed, stopping"; break
            fi
            sync || true
            IMSG=$(python3 scripts/internships.py) || IMSG=""
            FMSG=$(python3 scripts/fact.py) || FMSG=""
            if [ -n "$IMSG" ] && [ -n "$FMSG" ]; then MSG="$IMSG; $FMSG"
            elif [ -n "$IMSG" ]; then MSG="$IMSG"
            elif [ -n "$FMSG" ]; then MSG="Add fact"
            else echo "Nothing new to add, skipping"; continue; fi
            git add internships.md facts.md
            git commit -q -m "$MSG"
            push || true
            echo "Committed at $(date -u +%H:%M:%S)"
          done
          push || true
