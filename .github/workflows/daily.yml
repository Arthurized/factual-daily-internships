name: Daily log

on:
  schedule:
    - cron: '17 3 * * *'   # once a day, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make weighted-random number of commits (1-20, low numbers more likely)
        run: |
          git config user.name  "Arthurized"
          git config user.email "219266778+Arthurized@users.noreply.github.com"
          # weight of k is 1/k: P(1)≈28%, P(2)≈14%, ... P(20)≈1.4%
          N=$(python3 -c "import random; k=range(1,21); print(random.choices(k, weights=[1/i for i in k])[0])")
          echo "Making $N commits"
          for i in $(seq 1 "$N"); do
            echo "$(date -u '+%Y-%m-%d %H:%M:%S') ($i/$N)" > log.txt
            git add log.txt
            git commit -m "update log ($i/$N)"
          done
          git push
